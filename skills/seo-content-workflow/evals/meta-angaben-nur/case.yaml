name: meta-angaben-nur
expected_outcome: |
  Title, Meta-Description (Du-Anrede) und Slug mit Zeichenzahlen. Da Fokus-Keyword, Studioname und „kostenlose Probestunde“ nicht in 60 Zeichen passen, benennt die Antwort den Konflikt und bietet eine Lösung an (z. B. Probestunde in die Meta-Description), statt den Title stillschweigend zu überziehen. Kein vollständiger Landingpage-Text.
